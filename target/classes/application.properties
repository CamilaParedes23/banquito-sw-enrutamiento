spring.application.name=banquito-switch-routing-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SWITCH_ENRUTAMIENTO_DB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/init/001_create_routing_tables.sql

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

rabbit.exchange.batch=${RABBIT_EXCHANGE_BATCH:switch.batch.exchange}
rabbit.exchange.routing=${RABBIT_EXCHANGE_ROUTING:switch.routing.exchange}
rabbit.queue.routing.payment-lines=${RABBIT_QUEUE_ROUTING_PAYMENT_LINES:switch.routing.payment-lines.queue}
rabbit.queue.settlement.on-us=${RABBIT_QUEUE_SETTLEMENT_ON_US:switch.settlement.on-us.queue}
rabbit.queue.clearing.off-us=${RABBIT_QUEUE_CLEARING_OFF_US:switch.clearing.off-us.queue}
rabbit.queue.routing.rejected=${RABBIT_QUEUE_ROUTING_REJECTED:switch.routing.rejected.queue}
rabbit.routing-key.payment-line-requested=${RABBIT_ROUTING_KEY_PAYMENT_LINE_REQUESTED:payment.line.requested}
rabbit.routing-key.routed-on-us=${RABBIT_ROUTING_KEY_ROUTED_ON_US:payment.line.routed.on-us}
rabbit.routing-key.routed-off-us=${RABBIT_ROUTING_KEY_ROUTED_OFF_US:payment.line.routed.off-us}
rabbit.routing-key.line-rejected=${RABBIT_ROUTING_KEY_LINE_REJECTED:payment.line.rejected}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
